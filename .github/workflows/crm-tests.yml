# Type-checks, tests and builds the CRM app against a throwaway PostgreSQL.
# Never touches Aiven or Supabase.
name: CRM tests

on:
  pull_request:
    paths: ["crm-app/**", ".github/workflows/crm-tests.yml"]
  push:
    branches: [main]
    paths: ["crm-app/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: crm-app
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm-app/package-lock.json
      - run: npm ci
      - name: Database scripts run cleanly, twice
        run: |
          for i in 1 2; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f db/001_crm_schema.sql
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -v app_password=test_app -v etl_password=test_etl -f db/002_crm_roles.sql
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f db/seed/003_crm_seed.sql
          done
      - name: Logins have only the rights they should
        run: |
          PGPASSWORD=test_app psql -h localhost -U crm_app -d postgres -Atc "select count(*) from crm.accounts"
          ! PGPASSWORD=test_app psql -h localhost -U crm_app -d postgres -c "delete from crm.contacts" 2>/dev/null
          ! PGPASSWORD=test_etl psql -h localhost -U crm_etl_reader -d postgres -c "update crm.accounts set phone = null" 2>/dev/null
          PGPASSWORD=test_etl psql -h localhost -U crm_etl_reader -d postgres -Atc "select count(*) from crm.sales_budgets"
      - run: psql -h localhost -U postgres -c "create database crm_test"
      - run: npx tsc -b
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
